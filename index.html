<style>
:root{--fundo:#0A0A0A;--superficie:#161616;--superficie2:#1F1F1F;--borda:#2A2A2A;--texto:#FFFFFF;--texto-suave:#A3A3A3;--dourado:#B8963E;--positivo:#4CAF7A;--negativo:#D9534F;--raio:12px}

html,body{background:var(--fundo);color:var(--texto);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.topo{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda)}

select{background-image:linear-gradient(45deg,transparent 50%,#A3A3A3 50%),linear-gradient(135deg,#A3A3A3 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.btn.sec{background:transparent;color:var(--texto);border:1px solid var(--borda)}

.botoes{display:flex;gap:10px}

.link{background:none;border:0;color:var(--dourado);font:500 14px 'Inter',sans-serif;cursor:pointer;padding:0}
.tela-entrada{min-height:82vh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto}

.legenda{display:flex;gap:16px;font-size:12px;color:var(--texto-suave);margin-bottom:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sc-placar table{width:100%;border-collapse:collapse}
.sc-placar td{padding:6px 4px;font:500 20px 'IBM Plex Mono',monospace;text-align:center;width:38px}
.sc-placar td.sc-n{font:600 15px 'Inter',sans-serif;text-align:left;width:auto}
.sc-placar td.sc-p{color:var(--dourado);width:54px}
.sc-bola{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dourado);margin-right:8px}

.sc-tit{font-size:17px;font-weight:600;text-align:center;margin:18px 0 6px}
.sc-rally{display:flex;flex-direction:column;align-items:center;justify-content:center;width:168px;height:168px;margin:16px auto 10px;border-radius:50%;border:3px solid var(--dourado);background:rgba(184,150,62,.1);color:var(--texto);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}

.sc-rally span{font-size:12px;color:var(--texto-suave);margin-top:6px}
.sc-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sc-fim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-fim .col{display:flex;flex-direction:column;gap:8px}
.sc-fim h3{font-size:13px;font-weight:600;text-align:center}
.sc-b{background:var(--superficie2);border:1px solid var(--borda);border-radius:10px;padding:16px 6px;font:600 14px 'Inter',sans-serif;color:var(--texto);cursor:pointer;touch-action:manipulation}
.sc-b.g{border-color:var(--dourado);color:var(--dourado)}
.sc-b.w{border-color:var(--positivo);color:var(--positivo)}
.sc-b.ef{border-color:#E0B93B;color:#E0B93B}
.sc-b.en{border-color:var(--negativo);color:var(--negativo)}
.rot-g{font-size:12px;color:var(--texto-suave);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--superficie2);border:1px solid var(--borda);border-radius:999px;padding:10px 16px;font:500 14px 'Inter',sans-serif;color:var(--texto);cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--dourado);border-color:var(--dourado);color:#0A0A0A}
.zonas{display:flex;flex-direction:column;gap:6px}
.sc-rede{border-bottom:2px dashed var(--texto-suave);text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--texto-suave);padding-bottom:4px;margin-bottom:2px}
.zona{border:1px solid var(--z);border-left-width:6px;border-radius:10px;background:transparent;color:var(--texto);text-align:left;padding:9px 14px;font:600 14px 'Inter',sans-serif;cursor:pointer;touch-action:manipulation}
.zona small{display:block;font-weight:400;font-size:12px;color:var(--texto-suave)}
.zona.on{background:var(--z);color:#0A0A0A}
.zona.on small{color:#0A0A0A}
.z-verde{--z:#4CAF7A}.z-amarela{--z:#E0B93B}.z-vermelha{--z:#D9534F}.z-roxa{--z:#8E5BD6}
.sc-z{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--z);margin-right:8px}
.sc-log{font-size:13px;color:var(--texto-suave);padding:6px 0;border-bottom:1px solid var(--borda)}
.quadra{width:100%;height:auto;display:block;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
body.sc-q #topo,body.sc-q #nav{display:none!important}
body.sc-q main{max-width:none;padding:8px 8px 16px}
.sc-wrap{display:flex;flex-direction:column;gap:10px}
.sc-col{display:flex;flex-direction:column;gap:8px}
.sc-pn .sc-b{width:100%;padding:13px 6px}
.sc-mini td{font-size:16px;padding:3px 4px;width:30px}
.sc-mini td.sc-n{font-size:14px}
.sc-mini.card{padding:10px 12px}
.sc-cont{text-align:center;margin:4px 0 6px}
.sc-cont b{font:600 40px 'IBM Plex Mono',monospace;color:var(--dourado);line-height:1.1;display:block}
.sc-cont span{font-size:12px;color:var(--texto-suave)}
.sc-links{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:14px}
.sc-links .link{font-size:13px}
.sc-topo .btn{margin-top:10px;padding:11px 10px}
@media(orientation:landscape){body.sc-q .sc-wrap{flex-direction:row;align-items:flex-start}body.sc-q .sc-qd{flex:1;min-width:0}body.sc-q .sc-pn{width:236px;max-height:calc(100vh - 16px);overflow-y:auto}body.sc-q .sc-dica{display:none}body.sc-q .quadra{max-height:calc(100vh - 16px)}}
@media(min-width:720px){.modal{border-radius:16px;margin-bottom:10vh}.grid4{grid-template-columns:repeat(4,1fr)}}
</style>

<body>
<header id="topo" class="topo hidden"><div class="marca" role="img" aria-label="CARMONA"></div><span id="topo-sub"></span></header>
<main id="app"><div class="carregando"><div class="spin"></div></div></main>
<nav id="nav" class="nav hidden"></nav>
<div id="toast" class="toast"></div>

<script>
// ===== Configuração =====
const SUPABASE_URL = 'https://zcveqvnrftaymkgrewyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VjgOzBn1wD8-OBtTFbBGng_4P0ya9zN';

const RECUPERACAO = /type=recovery/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== Constantes =====
const UNIDADES = ['Limão Tênis', 'Marginal Tietê'];
const NIVEIS = [];
for (let i = 2; i <= 14; i++) NIVEIS.push((i / 2).toFixed(1));
const NOTAS = [['forehand','Forehand'],['backhand','Backhand'],['saque','Saque'],['devolucao','Devolução'],['voleio','Voleio'],['smash','Smash'],['movimentacao','Movimentação'],['tatica','Tática']];
const GRUPOS = [
  ['Saque', [['s1_total','1º saque: tentativas'],['s1_dentro','1º saque: em quadra'],['s1_ganhos','Pontos ganhos com 1º'],['s2_total','2º saque: tentativas'],['s2_dentro','2º saque: em quadra'],['s2_ganhos','Pontos ganhos com 2º'],['aces','Aces'],['duplas_faltas','Duplas faltas'],['saques_forcaram_erro','Saques que forçaram erro']]],
  ['Devolução', [['dev_jogados','Pontos jogados'],['dev_ganhos','Pontos ganhos']]],
  ['Depois do saque', [['winners','Winners'],['erros_provocados','Erros provocados'],['ene_rede','Erro não forçado: rede'],['ene_fundo','Erro não forçado: fundo'],['ene_lateral','Erro não forçado: lateral'],['erros_forcados_sofridos','Erros forçados sofridos']]],
  ['Pontos', [['pontos_ganhos','Pontos ganhos no total'],['pontos_ate_4','Ganhos com até 4 bolas'],['pontos_5_a_8','Ganhos com 5 a 8 bolas'],['pontos_9_mais','Ganhos com 9 bolas ou mais']]]
];
const CAMPOS = GRUPOS.flatMap(g => g[1].map(c => c[0]));

const ICON = {
  painel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  partidas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"/></svg>',
  evolucao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  perfil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  alunos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.5 0 4.5 1.5 5.5 4.5"/></svg>'
};

// ===== Estado e utilidades =====
const S = { session: null, perfil: null, charts: [], recFeita: false };
const $ = s => document.querySelector(s);
const app = $('#app');

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, erro) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (erro ? ' erro' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3400); }
function carregando() { app.innerHTML = '<div class="carregando"><div class="spin"></div></div>'; }
function erroAmigavel(e) {
  console.error(e);
  const m = (e && (e.message || e.error_description)) || '';
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use Entrar.';
  if (/Password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit|security purposes/i.test(m)) return 'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão. Confira a internet e tente de novo.';
  if (/Invalid API key|apikey/i.test(m)) return 'O app ainda não está configurado. Avise o professor.';
  return 'Algo deu errado. Tente de novo.';
}
function fmtData(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function fmtCurta(d) { if (!d) return ''; const [, m, dd] = d.split('-'); return `${dd}/${m}`; }
function hoje() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function n(v) { return Number(v) || 0; }
function pctNum(a, b) { return n(b) > 0 ? n(a) / n(b) * 100 : null; }
function pct(a, b) { const v = pctNum(a, b); return v === null ? '-' : Math.round(v) + '%'; }
function sinal(v) { return v > 0 ? '+' + v : String(v); }
function pl(q, s, p) { return q === 1 ? `1 ${s}` : `${q} ${p}`; }
function primeiroNome(nome) { return (nome || '').trim().split(/\s+/)[0] || ''; }
function soma(lista) { const t = {}; CAMPOS.forEach(c => t[c] = 0); lista.forEach(e => { if (e) CAMPOS.forEach(c => t[c] += n(e[c])); }); return t; }
function met(e) {
  const ene = n(e.ene_rede) + n(e.ene_fundo) + n(e.ene_lateral);
  const cons = n(e.winners) + n(e.erros_provocados);
  return { s1: pctNum(e.s1_dentro, e.s1_total), s1g: pctNum(e.s1_ganhos, e.s1_dentro), s2: pctNum(e.s2_dentro, e.s2_total), s2g: pctNum(e.s2_ganhos, e.s2_dentro), saque: pctNum(n(e.s1_ganhos) + n(e.s2_ganhos), e.s1_total), dev: pctNum(e.dev_ganhos, e.dev_jogados), ene, cons, saldo: cons - ene };
}
function lado(p, l) { return (p.estatisticas || []).find(e => e.lado === l); }
function opcoesNivel(sel, vazio) { return (vazio ? '<option value="">Selecione</option>' : '') + NIVEIS.map(x => `<option value="${x}" ${sel !== null && sel !== undefined && sel !== '' && Number(sel) === Number(x) ? 'selected' : ''}>${x}</option>`).join(''); }
function opcoes(lista, sel, vazio) { return (vazio ? '<option value="">Selecione</option>' : '') + lista.map(x => { const [v, t] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`; }).join(''); }
function limparCharts() { S.charts.forEach(c => c.destroy()); S.charts = []; }
function badgeRes(r) { return r === 'vitória' ? '<span class="badge v">Vitória</span>' : r === 'derrota' ? '<span class="badge d">Derrota</span>' : ''; }
function ehProf() { return S.perfil && S.perfil.papel === 'professor'; }
function confirmar(btn, texto, acao) {
  if (btn.dataset.c) { acao(); return; }
  const orig = btn.textContent; btn.dataset.c = '1'; btn.textContent = texto;
  setTimeout(() => { delete btn.dataset.c; btn.textContent = orig; }, 3500);
}
function trancar(btn, txt) { btn.disabled = true; btn._orig = btn.textContent; btn.textContent = txt; }
function soltar(btn) { btn.disabled = false; if (btn._orig) btn.textContent = btn._orig; }

// ===== Navegação =====
function mostrarTopo(on) { $('#topo').classList.toggle('hidden', !on); $('#topo-sub').textContent = S.perfil ? (S.perfil.nome || '') : ''; }
function esconderNav() { $('#nav').classList.add('hidden'); }
function montarNav() {
  const nav = $('#nav');
  const abas = ehProf() ? [['alunos','Alunos'],['perfil','Perfil']] : [['painel','Painel'],['partidas','Partidas'],['evolucao','Evolução'],['perfil','Perfil']];
  nav.innerHTML = abas.map(([k, t]) => `<button data-aba="${k}">${ICON[k]}<span>${t}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => ir(b.dataset.aba));
  nav.classList.remove('hidden');
}
function marcarNav(aba) { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('ativo', b.dataset.aba === aba)); }

const TELAS = {};
async function ir(tela, params = {}) {
  limparCharts(); window.scrollTo(0, 0);
  document.body.classList.remove('sc-q');
  const prof = ehProf();
  const aba = { painel:'painel', partidas:'partidas', partida: prof ? 'alunos' : 'partidas', evolucao: prof ? 'alunos' : 'evolucao', perfil:'perfil', alunos:'alunos', ficha:'alunos', novaPartida:'alunos', novaAvaliacao:'alunos', scoutNovo:'alunos', scout:'alunos', evoluir:'painel' }[tela];
  marcarNav(aba);
  try { await TELAS[tela](params); }
  catch (e) {
    app.innerHTML = `<div class="vazio">${esc(erroAmigavel(e))}<br><br><button class="link" id="denovo">Tentar de novo</button></div>`;
    $('#denovo').onclick = () => ir(tela, params);
  }
}

// ===== Autenticação =====
sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => tratarAuth(ev, session), 0); });

function tratarAuth(ev, session) {
  if (ev === 'PASSWORD_RECOVERY' || (RECUPERACAO && session && !S.recFeita)) {
    S.recFeita = true; S.session = session; mostrarTopo(false); esconderNav(); TELAS.novaSenha(); return;
  }
  if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') {
    if (ev === 'SIGNED_IN' && S.perfil && S.session && session && S.session.user.id === session.user.id) { S.session = session; return; }
    rotear(session);
  } else if (session) { S.session = session; }
}

async function rotear(session) {
  S.session = session; S.perfil = null;
  if (!session) { mostrarTopo(false); esconderNav(); TELAS.entrar(); return; }
  carregando();
  let perfil = null;
  for (let i = 0; i < 5 && !perfil; i++) {
    const { data, error } = await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle();
    if (error) { toast(erroAmigavel(error), true); break; }
    perfil = data;
    if (!perfil) await new Promise(r => setTimeout(r, 700));
  }
  S.perfil = perfil;
  mostrarTopo(true);
  if (!perfil || perfil.status !== 'ativo') { esconderNav(); TELAS.aguardando(); return; }
  montarNav();
  ir(ehProf() ? 'alunos' : 'painel');
}

// ===== Dados =====
async function carregarPartidas(alunoId, asc) {
  const { data, error } = await sb.from('partidas').select('*, estatisticas(*)').eq('aluno_id', alunoId).order('data', { ascending: !!asc }).order('criado_em', { ascending: !!asc });
  if (error) throw error; return data;
}
async function carregarAvaliacoes(alunoId) {
  const { data, error } = await sb.from('avaliacoes').select('*').eq('aluno_id', alunoId).order('data', { ascending: false }).order('criado_em', { ascending: false });
  if (error) throw error; return data;
}
async function carregarPerfil(id) {
  const { data, error } = await sb.from('perfis').select('*').eq('id', id).single();
  if (error) throw error; return data;
}

function itemPartida(p) {
  return `<div class="lista-item" data-partida="${p.id}">
    <div><div class="t">${esc(p.adversario || 'Adversário')}</div><div class="sub">${fmtData(p.data)}${p.formato ? ' · ' + esc(p.formato) : ''}</div></div>
    <div style="text-align:right"><div class="mono" style="margin-bottom:4px">${esc(p.placar || '')}</div>${badgeRes(p.resultado)}</div>
  </div>`;
}
function ligarPartidas(alunoId) { app.querySelectorAll('[data-partida]').forEach(el => el.onclick = () => ir('partida', { id: el.dataset.partida, alunoId })); }
function vazioPartidas() { return `<div class="card vazio">Nenhuma partida registrada ainda.<br>Assim que o professor lançar a primeira, ela aparece aqui.</div>`; }

TELAS.painel = async () => {
  carregando();
  const p = S.perfil;
  const partidas = await carregarPartidas(p.id);
  const v = partidas.filter(x => x.resultado === 'vitória').length, d = partidas.filter(x => x.resultado === 'derrota').length;
  const ult = partidas.slice(0, 5), ant = partidas.slice(5, 10);
  const mu = met(soma(ult.map(x => lado(x, 'aluno')))), ma = met(soma(ant.map(x => lado(x, 'aluno'))));
  const card = (rot, a, b, tipo) => {
    const txt = a === null ? '-' : tipo === 'pct' ? Math.round(a) + '%' : sinal(a);
    let seta = '';
    if (ant.length && a !== null && b !== null && Math.round(a) !== Math.round(b)) seta = a > b ? '<span class="seta-up">▲</span>' : '<span class="seta-down">▼</span>';
    const cls = tipo === 'saldo' && a !== null ? (a > 0 ? 'pos' : a < 0 ? 'neg' : '') : '';
    return `<div class="card metric"><div class="rot">${rot}</div><div class="val ${cls}">${txt} <span style="font-size:13px">${seta}</span></div></div>`;
  };
  app.innerHTML = `<p class="sub">Olá, ${esc(primeiroNome(p.nome))}</p><h1>Seu painel</h1>
    ${ehProf() ? '' : '<button class="btn sec" onclick="ir(\'evoluir\')" style="margin-top:14px">Onde quero evoluir</button>'}
    <div class="grid2" style="margin-top:16px">
      <div class="card metric"><div class="rot">Nível</div><div class="val nivel">${p.nivel ? Number(p.nivel).toFixed(1) : '-'}</div></div>
      <div class="card metric"><div class="rot">Partidas</div><div class="val">${partidas.length}</div><div class="sub mono">${v} V · ${d} D</div></div>
    </div>
    ${partidas.length ? `<h2>Média das últimas ${ult.length === 1 ? 'partida' : ult.length + ' partidas'}</h2>
      <div class="grid2">
        ${card('1º saque em quadra', mu.s1, ma.s1, 'pct')}
        ${card('Pontos com 1º saque', mu.s1g, ma.s1g, 'pct')}
        ${card('Pontos na devolução', mu.dev, ma.dev, 'pct')}
        ${card('Saldo', mu.saldo, ant.length ? ma.saldo : null, 'saldo')}
      </div>
      ${ant.length ? '<p class="sub" style="margin-top:10px">As setas comparam com as 5 partidas anteriores.</p>' : ''}
      <h2>Última partida</h2>${itemPartida(partidas[0])}` : `<h2>Partidas</h2>${vazioPartidas()}`}`;
  ligarPartidas(p.id);
};

// ===== Detalhe da partida =====
function paragrafoResumo(nome, e) {
  if (!e) return '';
  const m = met(e); const out = [];
  if (n(e.s1_total) > 0) {
    let t = `No saque, ${nome} colocou ${e.s1_dentro} de ${e.s1_total} primeiros saques em quadra (${pct(e.s1_dentro, e.s1_total)}) e venceu ${e.s1_ganhos} desses pontos (${pct(e.s1_ganhos, e.s1_dentro)}).`;
    if (n(e.s2_total) > 0) t += ` Precisou do segundo saque ${pl(n(e.s2_total), 'vez', 'vezes')}, acertou ${e.s2_dentro} e ganhou ${e.s2_ganhos} desses pontos (${pct(e.s2_ganhos, e.s2_dentro)}).`;
    else t += ' Não precisou do segundo saque.';
    const extras = [];
    if (n(e.aces)) extras.push(pl(n(e.aces), 'ace', 'aces'));
    if (n(e.saques_forcaram_erro)) extras.push(pl(n(e.saques_forcaram_erro), 'saque que forçou erro na devolução', 'saques que forçaram erro na devolução'));
    if (extras.length) t += ` Somou ${extras.join(' e ')}.`;
    t += n(e.duplas_faltas) ? ` Cometeu ${pl(n(e.duplas_faltas), 'dupla falta', 'duplas faltas')}.` : ' Não cometeu duplas faltas.';
    out.push(t);
  }
  if (n(e.dev_jogados) > 0) out.push(`Na devolução, ${nome} venceu ${e.dev_ganhos} de ${e.dev_jogados} pontos jogados contra o saque adversário (${pct(e.dev_ganhos, e.dev_jogados)}).`);
  const partes = [];
  partes.push(n(e.winners) ? `fez ${pl(n(e.winners), 'winner', 'winners')}` : 'não fez winners');
  if (n(e.erros_provocados)) partes.push(`provocou ${pl(n(e.erros_provocados), 'erro forçado', 'erros forçados')} no adversário`);
  let t2 = `Depois do saque, ${nome} ${partes.join(' e ')}.`;
  if (m.ene) {
    const det = [];
    if (n(e.ene_rede)) det.push(`${e.ene_rede} na rede`); if (n(e.ene_fundo)) det.push(`${e.ene_fundo} no fundo`); if (n(e.ene_lateral)) det.push(`${e.ene_lateral} na lateral`);
    t2 += ` Cometeu ${pl(m.ene, 'erro não forçado', 'erros não forçados')} (${det.join(', ')})`;
  } else t2 += ' Não cometeu erros não forçados';
  t2 += n(e.erros_forcados_sofridos) ? ` e sofreu ${pl(n(e.erros_forcados_sofridos), 'erro forçado', 'erros forçados')}.` : '.';
  t2 += ` O saldo entre pontos construídos e erros não forçados ficou em ${sinal(m.saldo)}.`;
  out.push(t2);
  return out.map(x => `<p>${esc(x)}</p>`).join('');
}

TELAS.partida = async ({ id }) => {

  const { data: p, error } = await sb.from('partidas').select('*, estatisticas(*)').eq('id', id).single();
  if (error) throw error;
  let pts = [];
  try { const rp = await sb.from('pontos').select('*').eq('partida_id', id).order('ordem'); if (!rp.error) pts = rp.data; } catch (e) {}
  const prof = ehProf();
  let nomeAluno = 'Você';
  if (prof) { const al = await carregarPerfil(p.aluno_id); nomeAluno = primeiroNome(al.nome) || 'Aluno'; }
  const a = lado(p, 'aluno') || soma([]), b = lado(p, 'adversario') || soma([]);
  const ma = met(a), mb = met(b);
  const nomeAdv = p.adversario || 'Adversário';
  const fr = (x, y) => n(y) > 0 ? `${n(x)}/${n(y)} <span class="sub">${pct(x, y)}</span>` : '-';
  const linha = (rot, va, vb) => `<tr><td>${rot}</td><td>${va}</td><td>${vb}</td></tr>`;
  const grupo = t => `<tr class="grupo"><td colspan="3">${t}</td></tr>`;
  const sal = v => `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${sinal(v)}</span>`;
  const totPts = n(a.pontos_ganhos) + n(b.pontos_ganhos);
  app.innerHTML = `<button class="link voltar" id="voltar">‹ Voltar</button>
    <p class="sub">${fmtData(p.data)}${p.formato ? ' · ' + esc(p.formato) : ''}</p>
    <h1>${prof ? esc(nomeAluno) + ' x ' : 'vs. '}${esc(nomeAdv)}</h1>
    <div class="linha" style="justify-content:flex-start;margin:8px 0 4px"><span class="mono" style="font-size:18px">${esc(p.placar || '')}</span>${badgeRes(p.resultado)}</div>
    ${p.observacoes ? `<p class="sub" style="margin-top:8px">${esc(p.observacoes)}</p>` : ''}
    <div class="card" style="margin-top:16px;overflow-x:auto">
      <table class="tabela"><thead><tr><th></th><th>${esc(nomeAluno)}</th><th>${esc(primeiroNome(nomeAdv))}</th></tr></thead><tbody>
      ${linha('Pontos ganhos', `${n(a.pontos_ganhos)} <span class="sub">${pct(a.pontos_ganhos, totPts)}</span>`, `${n(b.pontos_ganhos)} <span class="sub">${pct(b.pontos_ganhos, totPts)}</span>`)}
      ${grupo('Saque')}
      ${linha('1º saque em quadra', fr(a.s1_dentro, a.s1_total), fr(b.s1_dentro, b.s1_total))}
      ${linha('Pontos com 1º saque', fr(a.s1_ganhos, a.s1_dentro), fr(b.s1_ganhos, b.s1_dentro))}
      ${linha('2º saque em quadra', fr(a.s2_dentro, a.s2_total), fr(b.s2_dentro, b.s2_total))}
      ${linha('Pontos com 2º saque', fr(a.s2_ganhos, a.s2_dentro), fr(b.s2_ganhos, b.s2_dentro))}
      ${linha('Aces', n(a.aces), n(b.aces))}
      ${linha('Duplas faltas', n(a.duplas_faltas), n(b.duplas_faltas))}
      ${linha('Saques que forçaram erro', n(a.saques_forcaram_erro), n(b.saques_forcaram_erro))}
      ${grupo('Devolução')}
      ${linha('Pontos ganhos', fr(a.dev_ganhos, a.dev_jogados), fr(b.dev_ganhos, b.dev_jogados))}
      ${grupo('Depois do saque')}
      ${linha('Winners', n(a.winners), n(b.winners))}
      ${linha('Erros provocados', n(a.erros_provocados), n(b.erros_provocados))}
      ${linha('Erros não forçados', ma.ene, mb.ene)}
      ${linha('Saldo', sal(ma.saldo), sal(mb.saldo))}
      ${grupo('Pontos ganhos por tamanho')}
      ${linha('Até 4 bolas', n(a.pontos_ate_4), n(b.pontos_ate_4))}
      ${linha('5 a 8 bolas', n(a.pontos_5_a_8), n(b.pontos_5_a_8))}
      ${linha('9 bolas ou mais', n(a.pontos_9_mais), n(b.pontos_9_mais))}
      </tbody></table>
    </div>
    <h2>Resumo</h2>
    <div class="resumo">${paragrafoResumo(nomeAluno === 'Você' ? 'você' : nomeAluno, a)}${paragrafoResumo(primeiroNome(nomeAdv), b)}</div>
    ${pontoAPonto(pts, nomeAluno, primeiroNome(nomeAdv))}
    ${prof ? `<div class="botoes" style="margin-top:8px"><button class="btn sec" id="editar">Editar</button><button class="btn perigo" id="excluir">Excluir</button></div>` : ''}`;
  $('#voltar').onclick = () => prof ? ir('ficha', { id: p.aluno_id }) : ir('partidas');
  if (prof) {
    $('#editar').onclick = () => ir('novaPartida', { alunoId: p.aluno_id, partidaId: p.id });
    $('#excluir').onclick = e => confirmar(e.target, 'Toque de novo para excluir', async () => {

function opcoesChart(extra) {
  return Object.assign({
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1F1F1F', borderColor: '#2A2A2A', borderWidth: 1, titleFont: { family: 'Inter' }, bodyFont: { family: 'IBM Plex Mono' } } },
    scales: { x: { grid: { color: '#1F1F1F' }, ticks: { color: '#A3A3A3', font: { family: 'IBM Plex Mono', size: 10 }, maxRotation: 0, autoSkip: true } },
              y: { grid: { color: '#2A2A2A' }, ticks: { color: '#A3A3A3', font: { family: 'IBM Plex Mono', size: 10 } } } }
  }, extra || {});
}

TELAS.evolucao = async ({ alunoId } = {}) => {

    ['1º saque em quadra (%)', p => { const v = met(lado(p, 'aluno')).s1; return v === null ? null : Math.round(v); }, true],
    ['Pontos ganhos na devolução (%)', p => { const v = met(lado(p, 'aluno')).dev; return v === null ? null : Math.round(v); }, true],
    ['Saldo (construídos menos erros não forçados)', p => met(lado(p, 'aluno')).saldo, false],
    ['Erros não forçados na rede', p => n(lado(p, 'aluno').ene_rede), false]
  ];
  app.innerHTML = `${prof ? '<button class="link voltar" id="voltar">‹ Voltar</button>' : ''}
    <h1>Evolução${prof ? ' de ' + esc(primeiroNome(aluno.nome)) : ''}</h1>

    <h2>Avaliações por mesociclo</h2>
    ${avals.length ? `<div class="card">${avals.length > 1 ? `<div class="legenda"><span><i style="background:#B8963E"></i>${esc(avals[0].mesociclo || fmtData(avals[0].data))}</span><span><i style="background:#6B6B6B"></i>${esc(avals[1].mesociclo || fmtData(avals[1].data))}</span></div>` : ''}<div class="chart-radar"><canvas id="radar"></canvas></div></div>
      ${avals.map(a => `<div class="card" ${prof ? `data-aval="${a.id}" style="cursor:pointer"` : ''}>
        <div class="linha"><div><div style="font-weight:600">${esc(a.mesociclo || 'Avaliação')}</div><div class="sub">${fmtData(a.data)}</div></div>${a.nivel ? `<span class="badge ouro">${Number(a.nivel).toFixed(1)}</span>` : ''}</div>
        ${a.comentario ? `<p style="margin-top:10px;color:#D4D4D4">${esc(a.comentario)}</p>` : ''}</div>`).join('')}`
      : `<div class="card vazio">Nenhuma avaliação registrada ainda.</div>`}`;
  if (prof) {
    $('#voltar').onclick = () => ir('ficha', { id });
    app.querySelectorAll('[data-aval]').forEach(el => el.onclick = () => ir('novaAvaliacao', { alunoId: id, avaliacaoId: el.dataset.aval }));
  }
  if (comStats.length) {
    const labels = comStats.map(p => fmtCurta(p.data));
    series.forEach((s, i) => {
      const dados = comStats.map(s[1]);
      const ext = s[2] ? { suggestedMin: 0, suggestedMax: 100 } : {};
      const o = opcoesChart(); Object.assign(o.scales.y, ext);
      if (!s[2]) o.scales.y.ticks.precision = 0;
      S.charts.push(new Chart($('#g' + i), { type: 'line', data: { labels, datasets: [{ data: dados, borderColor: '#B8963E', backgroundColor: 'rgba(184,150,62,.12)', fill: true, tension: .3, pointRadius: 4, pointBackgroundColor: '#B8963E', spanGaps: true }] }, options: o }));
    });
  }
  if (avals.length) {
    const ds = [avals[0], avals[1]].filter(Boolean).map((a, i) => ({
      label: a.mesociclo || fmtData(a.data), data: NOTAS.map(([k]) => a.notas && a.notas[k] !== undefined && a.notas[k] !== null && a.notas[k] !== '' ? Number(a.notas[k]) : null),
      borderColor: i === 0 ? '#B8963E' : '#6B6B6B', backgroundColor: i === 0 ? 'rgba(184,150,62,.18)' : 'rgba(107,107,107,.12)', pointBackgroundColor: i === 0 ? '#B8963E' : '#6B6B6B', borderWidth: 2, spanGaps: true
    })).reverse();
    S.charts.push(new Chart($('#radar'), { type: 'radar', data: { labels: NOTAS.map(x => x[1]), datasets: ds },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, color: '#6B6B6B', backdropColor: 'transparent', font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: '#2A2A2A' }, angleLines: { color: '#2A2A2A' }, pointLabels: { color: '#FFFFFF', font: { family: 'Inter', size: 11 } } } } } }));
  }
};

function invPlacar(s) { return (s || '').replace(/(\d+)\s*-\s*(\d+)/g, '$2-$1'); }

TELAS.novaPartida = async ({ alunoId, partidaId }) => {
  carregando();
  const [aluno, outros] = await Promise.all([
    carregarPerfil(alunoId),
    sb.from('perfis').select('id,nome').eq('papel', 'aluno').eq('status', 'ativo').neq('id', alunoId).order('nome').then(r => { if (r.error) throw r.error; return r.data; })
  ]);
  let p = null;
  if (partidaId) { const r = await sb.from('partidas').select('*, estatisticas(*)').eq('id', partidaId).single(); if (r.error) throw r.error; p = r.data; }
  const A = p ? (lado(p, 'aluno') || {}) : {}, B = p ? (lado(p, 'adversario') || {}) : {};
  const linhasStats = GRUPOS.map(([g, campos]) => `<tr class="grupo"><td colspan="3">${g}</td></tr>` + campos.map(([c, rot]) =>
    `<tr><td>${rot}</td><td><input type="number" min="0" inputmode="numeric" name="a_${c}" value="${A[c] ?? ''}" placeholder="0"></td><td><input type="number" min="0" inputmode="numeric" name="b_${c}" value="${B[c] ?? ''}" placeholder="0"></td></tr>`).join('')).join('');
  app.innerHTML = `<button class="link voltar" id="voltar">‹ ${esc(primeiroNome(aluno.nome))}</button>
    <h1>${p ? 'Editar partida' : 'Nova partida'}</h1><p class="sub">${esc(aluno.nome)}</p>
    <button class="btn sec" id="colar" type="button">Colar do scout</button>
    <form id="f">
      <div class="grid2"><div><label>Data</label><input type="date" name="data" value="${esc(p ? p.data : hoje())}" required></div>
      <div><label>Resultado</label><select name="resultado">${opcoes([['vitória','Vitória'],['derrota','Derrota']], p ? p.resultado : '', true)}</select></div></div>
      <label>Adversário</label><select name="adversario_id" id="advSel">${opcoes([['','Não é aluno (digitar o nome)'], ...outros.map(o => [o.id, o.nome])], p ? (p.adversario_id || '') : '')}</select>
      <input name="adversario" id="advNome" placeholder="Nome do adversário" value="${esc(p ? p.adversario : '')}" style="margin-top:8px">
      <div class="grid2"><div><label>Placar</label><input name="placar" placeholder="7-5 ou 6-4 3-6 10-8" value="${esc(p ? p.placar : '')}"></div>
      <div><label>Formato</label><input name="formato" placeholder="Set, tiebreak, melhor de 3" value="${esc(p ? p.formato : '')}"></div></div>
      <label>Observações</label><textarea name="observacoes">${esc(p ? p.observacoes : '')}</textarea>
      <h2>Estatísticas</h2>
      <div class="card" style="overflow-x:auto"><table class="tabela"><thead><tr><th></th><th>${esc(primeiroNome(aluno.nome))}</th><th id="thAdv">Adversário</th></tr></thead><tbody>${linhasStats}</tbody></table></div>
      <label class="check hidden" id="espelhoBox"><input type="checkbox" id="espelho" checked> Lançar também para o adversário, com os lados invertidos</label>
      <button class="btn" type="submit">${p ? 'Salvar alterações' : 'Salvar partida'}</button>
    </form>`;
  const advSel = $('#advSel'), advNome = $('#advNome');
  const atualizarAdv = () => {
    const id = advSel.value;
    advNome.classList.toggle('hidden', !!id);
    $('#espelhoBox').classList.toggle('hidden', !id || !!p);
    const nome = id ? advSel.options[advSel.selectedIndex].text : advNome.value;
    $('#thAdv').textContent = primeiroNome(nome) || 'Adversário';
  };
  advSel.onchange = atualizarAdv; advNome.oninput = atualizarAdv; atualizarAdv();
  $('#voltar').onclick = () => p ? ir('partida', { id: p.id }) : ir('ficha', { id: alunoId });
  const form = $('#f');

  $('#colar').onclick = () => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h2 style="margin-top:0">Colar do scout</h2><p class="sub">Cole o JSON exportado pelo app de scout. Os campos são preenchidos para você revisar antes de salvar.</p>
      <textarea id="json" placeholder='{"partida": {...}, "aluno": {...}, "adversario": {...}}' style="margin-top:12px"></textarea>
      <div class="botoes"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="aplicar">Preencher</button></div></div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if (e.target === bg) bg.remove(); };
    $('#cancelar').onclick = () => bg.remove();
    $('#aplicar').onclick = () => {
      let o; try { o = JSON.parse($('#json').value); } catch (e) { toast('Esse texto não é um JSON válido.', true); return; }
      const pt = o.partida || {};
      ['data','placar','formato','observacoes','resultado'].forEach(k => { if (pt[k] !== undefined && form.elements[k]) form.elements[k].value = pt[k]; });
      if (pt.adversario !== undefined) { advSel.value = ''; advNome.value = pt.adversario; }
      CAMPOS.forEach(c => {
        if (o.aluno && o.aluno[c] !== undefined) form.elements['a_' + c].value = o.aluno[c];
        if (o.adversario && o.adversario[c] !== undefined) form.elements['b_' + c].value = o.adversario[c];
      });
      atualizarAdv(); bg.remove(); toast('Campos preenchidos. Confira e salve.');
    };
  };

  form.onsubmit = async ev => {
    ev.preventDefault(); const b = form.querySelector('button[type=submit]'); trancar(b, 'Salvando...');
    const fd = new FormData(form);
    const advId = fd.get('adversario_id') || null;
    const advNomeFinal = advId ? advSel.options[advSel.selectedIndex].text : (fd.get('adversario') || '').trim();
    const partida = { aluno_id: alunoId, data: fd.get('data'), adversario: advNomeFinal || null, adversario_id: advId, placar: (fd.get('placar') || '').trim() || null, resultado: fd.get('resultado') || null, formato: (fd.get('formato') || '').trim() || null, observacoes: (fd.get('observacoes') || '').trim() || null };
    const statsA = {}, statsB = {};
    CAMPOS.forEach(c => { statsA[c] = Math.max(0, parseInt(fd.get('a_' + c)) || 0); statsB[c] = Math.max(0, parseInt(fd.get('b_' + c)) || 0); });
    try {
      let pid = p ? p.id : null;
      if (pid) { const r = await sb.from('partidas').update(partida).eq('id', pid); if (r.error) throw r.error; }
      else { const r = await sb.from('partidas').insert(partida).select('id').single(); if (r.error) throw r.error; pid = r.data.id; }
      const r2 = await sb.from('estatisticas').upsert([{ partida_id: pid, lado: 'aluno', ...statsA }, { partida_id: pid, lado: 'adversario', ...statsB }], { onConflict: 'partida_id,lado' });
      if (r2.error) throw r2.error;

const FORMATOS = [['tb7','Tiebreak até 7'],['tb10','Super tiebreak até 10'],['set1','1 set'],['md3','Melhor de 3 sets'],['md3st','2 sets e super tiebreak']];
const ZONAS = [['verde','Verde','da linha de saque para a rede'],['amarela','Amarela','entre a linha de saque e a linha de base'],['vermelha','Vermelha','atrás da linha de base'],['roxa','Roxa','defesa crítica, 2 m ou mais atrás']];
const SITUACOES = [['fundo','Fundo'],['devolucao','Devolução'],['voleio','Voleio'],['smash','Smash'],['deixada','Deixada'],['lob','Lob']];
const DESTINOS = [['rede','Rede'],['fundo','Fundo'],['lateral','Lateral']];
const LADOS = [['forehand','Forehand'],['backhand','Backhand']];
const FIM_TXT = { winner: 'Winner', erro_forcado: 'Erro forçado', erro_nao_forcado: 'Erro não forçado', ace: 'Ace', dupla_falta: 'Dupla falta' };
let SC = null;
try { SC = JSON.parse(localStorage.getItem('carmona_scout')); } catch (e) {}
function salvarSC() { try { SC ? localStorage.setItem('carmona_scout', JSON.stringify(SC)) : localStorage.removeItem('carmona_scout'); } catch (e) {} }
function outro(l) { return l === 'aluno' ? 'adversario' : 'aluno'; }
function rotulo(lista, v) { const x = lista.find(i => i[0] === v); return x ? x[1] : ''; }

// Recalcula o placar inteiro a partir da lista de vencedores de cada ponto
function placarDe(cfg, vencedores) {
  const st = { sets: [], g: { aluno: 0, adversario: 0 }, p: { aluno: 0, adversario: 0 }, sacGame: cfg.primeiro, fim: false, vencedor: null };
  const soTb = () => cfg.formato === 'tb7' || cfg.formato === 'tb10' || (cfg.formato === 'md3st' && st.sets.length === 2);
  const alvoTb = () => cfg.formato === 'tb7' ? 7 : soTb() ? 10 : (st.g.aluno === 6 && st.g.adversario === 6 ? 7 : 0);
  const sacador = () => { if (!alvoTb()) return st.sacGame; const k = st.p.aluno + st.p.adversario; return Math.floor((k + 1) / 2) % 2 === 0 ? st.sacGame : outro(st.sacGame); };
  const fechaSet = (a, b) => {
    st.sets.push([a, b]); st.g = { aluno: 0, adversario: 0 };
    const alvo = cfg.formato === 'md3' || cfg.formato === 'md3st' ? 2 : 1;
    const wa = st.sets.filter(s => s[0] > s[1]).length, wb = st.sets.filter(s => s[1] > s[0]).length;
    if (wa === alvo) { st.fim = true; st.vencedor = 'aluno'; } else if (wb === alvo) { st.fim = true; st.vencedor = 'adversario'; }
  };
  for (const v of vencedores) {
    if (st.fim) break;
    const tb = alvoTb(), so = soTb();
    st.p[v]++;
    const a = st.p[v], b = st.p[outro(v)];
    if (tb) {
      if (a >= tb && a - b >= 2) {
        const sa = so ? st.p.aluno : st.g.aluno + (v === 'aluno' ? 1 : 0), sb2 = so ? st.p.adversario : st.g.adversario + (v === 'adversario' ? 1 : 0);
        st.p = { aluno: 0, adversario: 0 }; fechaSet(sa, sb2); st.sacGame = outro(st.sacGame);
      }
    } else if (cfg.noAd ? a >= 4 : (a >= 4 && a - b >= 2)) {
      st.p = { aluno: 0, adversario: 0 }; st.g[v]++; st.sacGame = outro(st.sacGame);
      if (st.g[v] >= 6 && st.g[v] - st.g[outro(v)] >= 2) fechaSet(st.g.aluno, st.g.adversario);
    }
  }
  const tb = !!alvoTb(), pa = st.p.aluno, pb = st.p.adversario, T = ['0', '15', '30', '40'];
  let txt;
  if (tb) txt = { aluno: String(pa), adversario: String(pb) };
  else if (pa >= 3 && pb >= 3) txt = { aluno: pa > pb ? 'AD' : '40', adversario: pb > pa ? 'AD' : '40' };
  else txt = { aluno: T[pa], adversario: T[pb] };
  return { sets: st.sets, g: st.g, p: st.p, txt, tb, soTb: soTb(), sacador: st.fim ? null : sacador(), fim: st.fim, vencedor: st.vencedor };
}
function placarTexto(pl) {
  const s = pl.sets.map(x => x.join('-'));
  if (!pl.fim) {
    if (pl.soTb) { if (pl.p.aluno + pl.p.adversario) s.push(pl.p.aluno + '-' + pl.p.adversario); }
    else if (pl.g.aluno + pl.g.adversario) s.push(pl.g.aluno + '-' + pl.g.adversario);
  }
  return s.join(' ');
}

// Transforma a lista de pontos nas contagens da tabela estatisticas
function estDePontos(pts, l) {
  const e = {}; CAMPOS.forEach(c => e[c] = 0);
  pts.forEach(p => {
    const ganhou = p.vencedor === l;
    if (ganhou) { e.pontos_ganhos++; if (p.rally <= 4) e.pontos_ate_4++; else if (p.rally <= 8) e.pontos_5_a_8++; else e.pontos_9_mais++; }
    if (p.sacador === l) {
      e.s1_total++;
      if (p.saque === 1) { e.s1_dentro++; if (ganhou) e.s1_ganhos++; }
      else { e.s2_total++; if (p.desfecho !== 'dupla_falta') { e.s2_dentro++; if (ganhou) e.s2_ganhos++; } }
      if (p.desfecho === 'ace') e.aces++;
      if (p.desfecho === 'dupla_falta') e.duplas_faltas++;
    } else { e.dev_jogados++; if (ganhou) e.dev_ganhos++; }
    if (p.desfecho === 'winner' && p.autor === l) e.winners++;
    if (p.desfecho === 'erro_nao_forcado' && p.autor === l) e['ene_' + (p.destino || 'fundo')]++;
    if (p.desfecho === 'erro_forcado') {
      const naDevolucao = p.rally === 1 && p.autor !== p.sacador;
      if (p.autor === l) e.erros_forcados_sofridos++; else if (naDevolucao) e.saques_forcaram_erro++; else e.erros_provocados++;
    }
  });
  return e;
}

function descPonto(p, nome) {
  const partes = [FIM_TXT[p.desfecho] + ' de ' + nome(p.autor)];
  if (p.lado_golpe) partes.push(rotulo(LADOS, p.lado_golpe).toLowerCase());
  if (p.situacao && p.situacao !== 'saque' && p.situacao !== 'fundo') partes.push(rotulo(SITUACOES, p.situacao).toLowerCase());
  if (p.destino) partes.push({ rede: 'na rede', fundo: 'no fundo', lateral: 'na lateral' }[p.destino]);
  if (p.zona) partes.push('zona ' + p.zona);
  if (p.rally > 1) partes.push(p.rally + ' bolas');
  return partes.join(' · ');
}

function pontoAPonto(pts, na, nb) {
  if (!pts || !pts.length) return '';
  const nome = l => l === 'aluno' ? na : nb;
  const erros = l => {
    const er = pts.filter(p => p.autor === l && (p.desfecho === 'erro_nao_forcado' || p.desfecho === 'erro_forcado'));
    if (!er.length) return '';
    const linhas = [['forehand', 'Forehand'], ['backhand', 'Backhand'], [null, 'Sem lado']].map(([v, t]) => {
      const f = er.filter(p => (p.lado_golpe || null) === v);
      return f.length ? `<tr><td>${t}</td>${DESTINOS.map(([d]) => `<td>${f.filter(p => p.destino === d).length}</td>`).join('')}<td>${f.length}</td></tr>` : '';
    }).join('');
    return `<h2>Erros por golpe e destino · ${esc(nome(l))}</h2><div class="card"><table class="tabela"><thead><tr><th></th><th>Rede</th><th>Fundo</th><th>Lateral</th><th>Total</th></tr></thead><tbody>${linhas}</tbody></table><p class="sub" style="margin-top:8px">Soma erros forçados e não forçados.</p></div>`;
  };
  const zonas = l => {

    const linhas = ZONAS.map(([v, t]) => {

      return f.length ? `<tr><td><i class="sc-z z-${v}"></i>${t}</td><td>${f.filter(p => p.vencedor === l).length}</td><td>${f.filter(p => p.vencedor !== l).length}</td></tr>` : '';
    }).join('');
    return `<h2>Última bola por zona · ${esc(nome(l))}</h2><div class="card"><table class="tabela"><thead><tr><th></th><th>Ganhou</th><th>Perdeu</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
  };
  PTS_VER = pts;
  const temTraj = pts.some(p => p.trajetoria);
  return erros('aluno') + zonas('aluno') + mapaDecisivas(pts, 'aluno', nome) + erros('adversario') + zonas('adversario') + mapaDecisivas(pts, 'adversario', nome) +
    `<h2>Ponto a ponto</h2>${temTraj ? '<p class="sub" style="margin-bottom:8px">Toque em um ponto da lista para ver a trajetória na quadra.</p><div id="ptQuadra"></div>' : ''}<details class="card" ${temTraj ? 'open' : ''}><summary style="cursor:pointer">Ver os ${pts.length} pontos</summary>${pts.map((p, i) => `<div class="sc-log" ${p.trajetoria ? `onclick="verPonto(${i})" style="cursor:pointer;color:var(--texto)"` : ''}>${i + 1}. <span class="mono">${esc(p.games || '')} ${esc(p.placar || '')}</span> ${esc(descPonto(p, nome))}</div>`).join('')}</details>`;
}

  app.querySelectorAll('[data-fim]').forEach(b => b.onclick = () => {
    const [tipo, autor] = b.dataset.fim.split('|');
    e.fim = { tipo, autor }; e.fase = 'detalhe';
    e.det = { destino: null, lado_golpe: null, situacao: e.rally === 1 && autor !== sac ? 'devolucao' : 'fundo', zona: null };
    salvarSC(); R();
  });
  app.querySelectorAll('[data-g] [data-v]').forEach(b => b.onclick = () => { const g = b.parentElement.dataset.g; e.det[g] = e.det[g] === b.dataset.v ? null : b.dataset.v; salvarSC(); R(); });
  on('#scVoltar', () => { e.fase = 'rally'; salvarSC(); R(); });
  on('#scOk', () => { const f = e.fim, w = f.tipo === 'winner'; scRegistrar(Object.assign({ vencedor: w ? f.autor : outro(f.autor), autor: f.autor, desfecho: f.tipo, rally: e.rally + (w ? 1 : 0) }, e.det)); });
  on('#scUndo', () => { if (e.fase !== 'saque' || e.saque === 2) SC.est = { fase: 'saque', saque: 1, rally: 0 }; else SC.pontos.pop(); salvarSC(); R(); });
  on('#scFim', ev => { if (!SC.pontos.length) { toast('Nenhum ponto marcado ainda.', true); return; } confirmar(ev.target, 'Toque de novo para salvar', () => scoutSalvar(ev.target)); });
  on('#scSalvar', ev => scoutSalvar(ev.target));
  on('#scDesc', ev => confirmar(ev.target, 'Toque de novo para descartar tudo', () => { const id = SC.alunoId; SC = null; salvarSC(); ir('ficha', { id }); }));
};

async function scoutSalvar(btn) {
  trancar(btn, 'Salvando...');
  const pl = placarDe(SC.cfg, SC.pontos.map(p => p.vencedor));
  const res = pl.fim ? (pl.vencedor === 'aluno' ? 'vitória' : 'derrota') : null;
  const fmt = rotulo(FORMATOS, SC.cfg.formato) + (SC.cfg.noAd ? ', sem vantagem' : '');
  const criadas = [];
  const gravar = async (alunoId, advNome, advId, pts, placar, resultado) => {
    const r = await sb.from('partidas').insert({ aluno_id: alunoId, data: SC.data, adversario: advNome, adversario_id: advId, placar: placar || null, resultado, formato: fmt }).select('id').single();
    if (r.error) throw r.error;
    const pid = r.data.id; criadas.push(pid);
    const r2 = await sb.from('estatisticas').insert([Object.assign({ partida_id: pid, lado: 'aluno' }, estDePontos(pts, 'aluno')), Object.assign({ partida_id: pid, lado: 'adversario' }, estDePontos(pts, 'adversario'))]);
    if (r2.error) throw r2.error;
    const r3 = await sb.from('pontos').insert(pts.map((p, i) => ({ partida_id: pid, ordem: i + 1, set_n: p.set_n, games: p.games, placar: p.placar, sacador: p.sacador, saque: p.saque, vencedor: p.vencedor,
      desfecho: p.desfecho, autor: p.autor, lado_golpe: p.lado_golpe, situacao: p.situacao, destino: p.destino, zona: p.zona, rally: p.rally, trajetoria: p.trajetoria || null })));
    if (r3.error) throw r3.error;
    return pid;
  };
  try {
    const pid = await gravar(SC.alunoId, SC.advCompleto, SC.advId, SC.pontos, placarTexto(pl), res);
    if (SC.advId && SC.espelho) {
      const inv = SC.pontos.map(p => Object.assign({}, p, { sacador: outro(p.sacador), vencedor: outro(p.vencedor), autor: outro(p.autor), games: invPlacar(p.games), placar: p.placar.split('-').reverse().join('-'),
        trajetoria: p.trajetoria ? { p: p.trajetoria.p.map(q => [-q[0], -q[1]]), f: p.trajetoria.f ? [-p.trajetoria.f[0], -p.trajetoria.f[1]] : null } : null }));
      await gravar(SC.advId, SC.alunoCompleto, SC.alunoId, inv, invPlacar(placarTexto(pl)), res ? (res === 'vitória' ? 'derrota' : 'vitória') : null);
    }
    SC = null; salvarSC(); toast('Partida salva.'); ir('partida', { id: pid });
  } catch (err) {
    if (criadas.length) { try { await sb.from('partidas').delete().in('id', criadas); } catch (e2) {} }
    toast(erroAmigavel(err) + ' Os pontos continuam guardados neste aparelho.', true); soltar(btn);
  }
}

// ===== Scout na quadra =====
// Coordenadas em metros, origem no centro da rede. O aluno fica sempre no lado esquerdo (x negativo).
function quadraSVG(extra, attrs) {
  const L = 11.885, W = 5.485, S = 4.115, SL = 6.4;
  const faixa = (a, b, cor) => [-1, 1].map(s => `<rect x="${Math.min(s * a, s * b)}" y="-8" width="${Math.abs(b - a)}" height="16" fill="${cor}" opacity=".2"/>`).join('');
  return `<svg ${attrs || ''} class="quadra" viewBox="-16.9 -8 33.8 16" xmlns="http://www.w3.org/2000/svg"><rect x="-16.9" y="-8" width="33.8" height="16" fill="#111"/>
    ${faixa(0, SL, '#4CAF7A')}${faixa(SL, L, '#E0B93B')}${faixa(L, L + 2, '#D9534F')}${faixa(L + 2, 16.9, '#8E5BD6')}
    <g fill="none" stroke="#fff" stroke-width=".09"><rect x="${-L}" y="${-W}" width="${2 * L}" height="${2 * W}"/><path d="M${-L} ${-S}H${L}M${-L} ${S}H${L}M${-SL} ${-S}V${S}M${SL} ${-S}V${S}M${-SL} 0H${SL}M${-L} 0h.35M${L} 0h-.35"/></g>
    <path d="M0 -6.2V6.2" stroke="#fff" stroke-width=".2" stroke-dasharray=".35 .25"/>${extra || ''}</svg>`;
}
const COR_FIM = { winner: '#4CAF7A', erro_forcado: '#E0B93B', erro_nao_forcado: '#D9534F' };
function trajOver(P, f, cor) {
  const todos = f ? P.concat([f]) : P;
  let o = todos.length > 1 ? `<polyline points="${todos.map(p => p.join(',')).join(' ')}" fill="none" stroke="#B8963E" stroke-width=".14" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  o += P.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r=".62" fill="${p[0] < 0 ? '#B8963E' : '#fff'}"/><text x="${p[0]}" y="${p[1] + .27}" font-size=".78" font-weight="700" text-anchor="middle" fill="#0A0A0A" font-family="IBM Plex Mono,monospace">${i + 1}</text>`).join('');
  if (f) o += `<path d="M${f[0] - .45} ${f[1] - .45}l.9 .9m0 -.9l-.9 .9" stroke="${cor || '#fff'}" stroke-width=".22" stroke-linecap="round"/>`;
  return o;
}
function zonaDe(p) { const d = Math.abs(p[0]); return d < 6.4 ? 'verde' : d < 11.885 ? 'amarela' : d < 13.885 ? 'vermelha' : 'roxa'; }
function destinoDe(p) { return Math.abs(p[0]) < 1 ? 'rede' : Math.abs(p[0]) > 11.885 ? 'fundo' : Math.abs(p[1]) > 4.115 ? 'lateral' : null; }

function scQuadra(pl, nome, R) {
  const e = SC.est, sac = pl.sacador, rec = outro(sac);
  if (!e.traj) e.traj = [];
  const par = (pl.p.aluno + pl.p.adversario) % 2 === 0;
  const saquePos = [sac === 'aluno' ? -12.4 : 12.4, (sac === 'aluno' ? 1 : -1) * (par ? 2 : -2)];
  const ladoDe = p => p[0] < 0 ? 'aluno' : 'adversario';
  const ult = e.traj[e.traj.length - 1];
  const P = [saquePos].concat(e.fase === 'saque' ? [] : e.traj);
  const over = trajOver(P, e.fase === 'detalhe' ? e.fimPos : null, e.fim ? COR_FIM[e.fim.tipo] : null);
  const linha = l => `<tr><td class="sc-n"><i class="sc-bola ${sac === l ? '' : 'off'}"></i>${esc(nome(l))}</td>${pl.sets.map(s => `<td>${s[l === 'aluno' ? 0 : 1]}</td>`).join('')}${pl.soTb ? '' : `<td>${pl.g[l]}</td>`}<td class="sc-p">${pl.txt[l]}</td></tr>`;
  let corpo;
  if (e.fase === 'saque') {
    corpo = `<div class="sc-tit">${e.saque}º saque de ${esc(nome(sac))}</div>
      <div class="sc-col"><button class="sc-b g" id="scIn">Dentro</button><button class="sc-b w" id="scAce">Ace</button><button class="sc-b en" id="scFalta">${e.saque === 1 ? 'Falta' : 'Dupla falta'}</button></div>`;
  } else if (e.fase === 'rally') {
    corpo = `<div class="sc-cont"><b>${1 + e.traj.length}</b><span>${e.traj.length ? 'bolas no ponto' : 'saque em quadra'}</span></div>
      ${ult ? `<p class="sub" style="text-align:center;margin-bottom:8px">Última batida: ${esc(nome(ladoDe(ult)))}. Continue tocando ou feche o ponto.</p>
        <div class="sc-col"><button class="sc-b w" data-fim="winner">Winner</button><button class="sc-b ef" data-fim="erro_forcado">Erro forçado</button><button class="sc-b en" data-fim="erro_nao_forcado">Erro não forçado</button></div>`
      : `<p class="sub" style="text-align:center">Toque na quadra onde ${esc(nome(rec))} bateu a devolução. Depois, um toque para cada batida.</p>`}`;
  } else {
    const f = e.fim, d = e.det, erro = f.tipo !== 'winner';
    const grupo = (g, lista) => `<div class="chips" data-g="${g}">${lista.map(([v, t]) => `<button class="chip ${d[g] === v ? 'on' : ''}" data-v="${v}">${t}</button>`).join('')}</div>`;
    corpo = `<div class="sc-tit" style="margin-top:8px">${FIM_TXT[f.tipo]} de ${esc(nome(f.autor))}</div>
      <p class="sub" style="text-align:center">${e.fimPos ? 'Batida da zona ' + d.zona + '.' : 'Toque na quadra onde a bola foi parar.'}</p>
      <div class="botoes sc-topo"><button class="btn sec" id="scVoltar">Voltar</button><button class="btn" id="scOk" ${erro && !d.destino ? 'disabled' : ''}>Salvar</button></div>
      ${erro ? `<div class="rot-g">Onde a bola foi</div>${grupo('destino', DESTINOS)}` : ''}
      <div class="rot-g">Golpe</div>${grupo('lado_golpe', LADOS)}
      <div class="rot-g">Situação</div>${grupo('situacao', SITUACOES)}
`;
  }
  app.innerHTML = `<div class="sc-wrap"><div class="sc-qd">${quadraSVG(over, 'id="scSvg"')}</div>
    <div class="sc-pn"><div class="card sc-placar sc-mini" style="margin-bottom:8px"><table>${linha('aluno')}${linha('adversario')}</table></div>
      <p class="sub sc-dica" style="text-align:center">Deite o celular para a quadra ficar maior.</p>
      ${corpo}
      <div class="sc-links"><button class="link" id="scUndo">Desfazer</button><button class="link" id="scFim">Encerrar e salvar</button><button class="link" id="scSair">Sair sem perder</button><button class="link" id="scModo">Usar botões</button></div>
    </div></div>`;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#scIn', () => { e.fase = 'rally'; e.rally = 1; e.traj = []; salvarSC(); R(); });
  on('#scAce', () => scRegistrar({ vencedor: sac, autor: sac, desfecho: 'ace', situacao: 'saque', rally: 1 }));
  on('#scFalta', () => { if (e.saque === 1) { e.saque = 2; salvarSC(); R(); } else scRegistrar({ vencedor: rec, autor: sac, desfecho: 'dupla_falta', situacao: 'saque', rally: 0 }); });
  app.querySelectorAll('[data-fim]').forEach(b => b.onclick = () => {
    const autor = ladoDe(ult), z = zonaDe(ult);
    e.fim = { tipo: b.dataset.fim, autor }; e.fase = 'detalhe'; e.fimPos = null;
    e.det = { destino: null, lado_golpe: null, situacao: z === 'verde' ? 'voleio' : e.traj.length === 1 ? 'devolucao' : 'fundo', zona: z };
    salvarSC(); R();
  });
  app.querySelectorAll('[data-g] [data-v]').forEach(b => b.onclick = () => { const g = b.parentElement.dataset.g; e.det[g] = e.det[g] === b.dataset.v ? null : b.dataset.v; salvarSC(); R(); });
  on('#scVoltar', () => { e.fase = 'rally'; e.fimPos = null; salvarSC(); R(); });
  on('#scOk', () => { const f = e.fim, w = f.tipo === 'winner'; scRegistrar(Object.assign({ vencedor: w ? f.autor : outro(f.autor), autor: f.autor, desfecho: f.tipo, rally: e.traj.length + (w ? 1 : 0), trajetoria: { p: P, f: e.fimPos || null } }, e.det)); });
  on('#scUndo', () => {
    if (e.fase === 'detalhe') { e.fase = 'rally'; e.fimPos = null; }
    else if (e.fase === 'rally' && e.traj.length) e.traj.pop();
    else if (e.fase !== 'saque' || e.saque === 2) SC.est = { fase: 'saque', saque: 1, rally: 0 };
    else SC.pontos.pop();
    salvarSC(); R();
  });
  on('#scFim', ev => { if (!SC.pontos.length) { toast('Nenhum ponto marcado ainda.', true); return; } confirmar(ev.target, 'Toque de novo para salvar', () => scoutSalvar(ev.target)); });
  on('#scSair', () => ir('ficha', { id: SC.alunoId }));
  on('#scModo', () => { SC.modo = 'botoes'; SC.est = { fase: 'saque', saque: 1, rally: 0 }; salvarSC(); R(); });
  const svg = $('#scSvg');
  svg.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    const p = [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10];
    if (e.fase === 'rally') {
      const esperado = e.traj.length % 2 === 0 ? rec : sac;
      if (ladoDe(p) === esperado) e.traj.push(p);
      else if (e.traj.length) e.traj[e.traj.length - 1] = p;
      else { toast('A devolução é de ' + nome(rec) + '. Toque no lado dele.', true); return; }
    } else if (e.fase === 'detalhe') {
      e.fimPos = p;
      if (e.fim.tipo !== 'winner') { const d = destinoDe(p); if (d) e.det.destino = d; }
    } else { toast('Marque primeiro o saque nos botões.'); return; }
    salvarSC(); R();
  });
}

// Mapas na página da partida
let PTS_VER = [];
function mapaDecisivas(pts, l, nome) {
  const f = pts.filter(p => p.autor === l && p.trajetoria && p.trajetoria.f && COR_FIM[p.desfecho]);
  if (!f.length) return '';
  const over = f.map(p => { const a = p.trajetoria.p[p.trajetoria.p.length - 1], b = p.trajetoria.f, c = COR_FIM[p.desfecho];
    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width=".13" opacity=".9"/><circle cx="${a[0]}" cy="${a[1]}" r=".3" fill="${c}"/><circle cx="${b[0]}" cy="${b[1]}" r=".2" fill="none" stroke="${c}" stroke-width=".1"/>`; }).join('');
  return `<h2>Bolas decisivas · ${esc(nome(l))}</h2><div class="card"><div class="legenda"><span><i style="background:#4CAF7A"></i>Winner</span><span><i style="background:#E0B93B"></i>Erro forçado</span><span><i style="background:#D9534F"></i>Erro não forçado</span></div>${quadraSVG(over)}<p class="sub" style="margin-top:8px">Cada linha sai de onde a bola foi batida e termina onde ela parou.</p></div>`;
}
function verPonto(i) {
  const p = PTS_VER[i]; if (!p || !p.trajetoria) return;
  const box = $('#ptQuadra'); if (!box) return;
  box.innerHTML = `<div class="card"><div class="sub" style="margin-bottom:8px">Ponto ${i + 1} · ${esc(p.games || '')} ${esc(p.placar || '')} · ${esc(FIM_TXT[p.desfecho])}</div>${quadraSVG(trajOver(p.trajetoria.p, p.trajetoria.f, COR_FIM[p.desfecho]))}</div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}


async function carregarTurmas() {
  const { data, error } = await sb.from('turmas').select('*').order('nome');
  if (error) return [];
  return data || [];
}

// ===== Onde quero evoluir (aluno) =====
const TEMAS_ALUNO = [
  { id: 'direita', titulo: 'Minha direita (forehand)', blocos: [
    { pergunta: 'Qual efeito da sua direita você quer melhorar?', opcoes: [['direita.efeito.topspin','Com efeito (topspin)'], ['direita.efeito.slice','Cortada (slice)']] },
    { pergunta: 'Em qual bola você sente mais dificuldade?', opcoes: [['direita.bola.alta','Bola alta'], ['direita.bola.baixa','Bola baixa'], ['direita.bola.ataque','Bola de ataque'], ['direita.bola.defesa','Bola de defesa']] }
  ] },
  { id: 'esquerda', titulo: 'Minha esquerda (backhand)', blocos: [
    { pergunta: 'Qual efeito da sua esquerda você quer melhorar?', opcoes: [['esquerda.efeito.topspin','Com efeito (topspin)'], ['esquerda.efeito.slice','Cortada (slice)']] },
    { pergunta: 'Em qual bola você sente mais dificuldade?', opcoes: [['esquerda.bola.alta','Bola alta'], ['esquerda.bola.baixa','Bola baixa'], ['esquerda.bola.ataque','Bola de ataque'], ['esquerda.bola.defesa','Bola de defesa']] }
  ] },
  { id: 'saque', titulo: 'Meu saque', blocos: [
    { pergunta: 'O que acontece com o seu saque?', opcoes: [['saque.primeiro','Primeiro saque não entra o suficiente'], ['saque.segundo','Segundo saque sem segurança'], ['saque.fundo','Ele sai do fundo da quadra'], ['saque.rede','Ele fica na rede']] }
  ] },
  { id: 'situacoes', titulo: 'Situações do jogo', blocos: [
    { pergunta: 'Em que situação você sente mais dificuldade?', opcoes: [['situacao.subida','Quando subo à rede'], ['situacao.defesa','Quando estou defendendo'], ['situacao.ataque','Quando estou atacando'], ['situacao.construir','Quando preciso construir o ponto'], ['situacao.volume','Quando erro muito rápido']] }
  ] }
];

function rotuloTema(codigo) {
  for (const g of TEMAS_ALUNO) for (const b of g.blocos) for (const [c, t] of b.opcoes) if (c === codigo) return { grupo: g.titulo, texto: t };
  return { grupo: '', texto: codigo };
}

TELAS.evoluir = async () => {
  carregando();
  const p = S.perfil;
  const { data, error } = await sb.from('escolhas_tema').select('tema').eq('aluno_id', p.id);
  if (error) throw error;
  const escolhidos = new Set((data || []).map(x => x.tema));
  app.innerHTML = `<button class="link voltar" id="voltar">‹ Painel</button>
    <h1>Onde quero evoluir</h1>
    <p class="sub">Toque no que faz sentido para você. Pode marcar mais de um. Você pode mudar quando quiser.</p>
    ${TEMAS_ALUNO.map(g => `<h2>${esc(g.titulo)}</h2>${g.blocos.map(b => `<p class="sub" style="margin:14px 0 8px;color:#D4D4D4">${esc(b.pergunta)}</p><div class="chips">${b.opcoes.map(([c, t]) => `<button class="chip ${escolhidos.has(c) ? 'on' : ''}" data-tema="${c}">${esc(t)}</button>`).join('')}</div>`).join('')}`).join('')}`;
  $('#voltar').onclick = () => ir('painel');
  app.querySelectorAll('[data-tema]').forEach(el => el.onclick = async () => {
    const c = el.dataset.tema, ligado = el.classList.contains('on');
    el.classList.toggle('on');
    const r = ligado
      ? await sb.from('escolhas_tema').delete().eq('aluno_id', p.id).eq('tema', c)
      : await sb.from('escolhas_tema').insert({ aluno_id: p.id, tema: c });
    if (r.error) { el.classList.toggle('on'); toast(erroAmigavel(r.error), true); }
  });
};

// Professor: temas escolhidos pelo aluno (na ficha)
async function carregarTemasFicha(id) {
  const el = $('#temas');
  if (!el) return;
  const { data, error } = await sb.from('escolhas_tema').select('tema').eq('aluno_id', id);
  if (error) { el.innerHTML = '<span class="sub">Não foi possível carregar.</span>'; return; }
  if (!data || !data.length) { el.innerHTML = '<span class="sub">O aluno ainda não escolheu temas.</span>'; return; }
  const grupos = {};
  data.forEach(x => { const r = rotuloTema(x.tema); (grupos[r.grupo] = grupos[r.grupo] || []).push(r.texto); });
  el.innerHTML = Object.entries(grupos).map(([g, itens]) => `<div style="margin-bottom:10px"><span class="sub" style="display:block">${esc(g)}</span>${itens.map(t => esc(t)).join(' · ')}</div>`).join('');
}
